<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC音乐播放</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            padding: 20px;
            box-sizing: border-box;
        }
        .buttons {
            margin-bottom: 20px;
        }
        button {
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
            margin: 0 10px;
            border: none;
            border-radius: 5px;
            background-color: #4CAF50;
            color: white;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        #pauseButton {
            background-color: #f44336;
            display: none;
        }
        #pauseButton:hover {
            background-color: #d32f2f;
        }
        .welcome-text {
            font-size: 24px;
            margin: 20px 0;
            text-align: center;
        }
        .instruction-image {
            max-width: 100%;
            height: auto;
            margin-top: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="buttons">
        <button id="playButton">播放音乐</button>
        <button id="pauseButton">暂停音乐</button>
    </div>
    
    <div class="welcome-text">欢迎使用NFC播放音乐</div>
    
    <img src="shuomingshu.jpg" alt="使用说明" class="instruction-image">
    
    <audio id="bgMusic" loop>
        <source src="kongchengji.mp3" type="audio/mpeg">
        您的浏览器不支持音频元素。
    </audio>

    <script>
        const playButton = document.getElementById('playButton');
        const pauseButton = document.getElementById('pauseButton');
        const bgMusic = document.getElementById('bgMusic');

        // 点击播放
        playButton.addEventListener('click', () => {
            bgMusic.play()
                .then(() => {
                    playButton.style.display = 'none';
                    pauseButton.style.display = 'inline-block';
                })
                .catch(e => console.error('播放失败:', e));
        });

        // 点击暂停
        pauseButton.addEventListener('click', () => {
            bgMusic.pause();
            pauseButton.style.display = 'none';
            playButton.style.display = 'inline-block';
        });

        // 尝试自动播放（可能被浏览器阻止）
        bgMusic.play().catch(e => {
            console.log('自动播放被阻止，请用户点击播放');
        });
    </script>
</body>
</html>
