<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC音乐播放</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            font-size: 24px;
            background-color: #f0f0f0;
        }
        button {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            margin: 5px;
        }
        #pauseButton {
            display: none; /* 初始隐藏暂停按钮 */
        }
    </style>
</head>
<body>
    <div>
   	  <button id="playButton">点击播放音乐</button>
      <button id="pauseButton">暂停音乐</button>
      <p>欢迎使用NFC功能查看说明书</p>
        <p><img src="shuomingshu.jpg" width="800" height="1224"></p>
    </div>
    
    <audio id="bgMusic" loop>
        <source src="kongchengji.mp3" type="audio/mpeg">
        您的浏览器不支持音频元素。
    </audio>

    <script>
        const playButton = document.getElementById('playButton');
        const pauseButton = document.getElementById('pauseButton');
        const bgMusic = document.getElementById('bgMusic');

        // 点击播放
        playButton.addEventListener('click', () => {
            bgMusic.play()
                .then(() => {
                    playButton.style.display = 'none'; // 隐藏播放按钮
                    pauseButton.style.display = 'inline-block'; // 显示暂停按钮
                })
                .catch(e => console.error('播放失败:', e));
        });

        // 点击暂停
        pauseButton.addEventListener('click', () => {
            bgMusic.pause();
            pauseButton.style.display = 'none'; // 隐藏暂停按钮
            playButton.style.display = 'inline-block'; // 显示播放按钮
        });

        // 尝试自动播放（可能被浏览器阻止）
        bgMusic.play().catch(e => {
            console.log('自动播放被阻止，请用户点击播放');
        });
    </script>
</body>
</html>
