<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC音乐播放器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            overflow: hidden;
        }
        
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .container {
            background: rgba(0, 0, 0, 0.7);
            padding: 40px 60px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            max-width: 90%;
            animation: fadeIn 1.5s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            background: linear-gradient(to right, #ff7e5f, #feb47b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .nfc-icon {
            font-size: 5rem;
            margin-bottom: 25px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        .music-player {
            margin-top: 30px;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }
        
        button {
            background: linear-gradient(to right, #ff7e5f, #feb47b);
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }
        
        button:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        
        button:active {
            transform: scale(0.95);
        }
        
        .volume-control {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            gap: 10px;
        }
        
        input[type="range"] {
            width: 200px;
            height: 8px;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            outline: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ff7e5f;
            cursor: pointer;
        }
        
        .status {
            margin-top: 20px;
            font-size: 1.2rem;
            color: #feb47b;
        }
        
        .song-info {
            margin-top: 15px;
            font-size: 1.1rem;
            color: #ccc;
        }
        
        .waves {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100px;
            overflow: hidden;
            z-index: -1;
        }
        
        .wave {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 200%;
            height: 100px;
            background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg"><path d="M0 0v46.29c47.79 22.2 103.59 32.17 158 28 70.36-5.37 136.33-33.31 206.8-37.5 73.84-4.36 147.54 16.88 218.2 35.26 69.27 18 138.3 24.88 209.4 13.08 36.15-6 69.85-17.84 104.45-29.34C989.49 25 1113-14.29 1200 52.47V0z" fill="rgba(255,255,255,0.07)"/></svg>');
            background-size: 1200px 100px;
            animation: wave 18s linear infinite;
        }
        
        .wave:nth-child(2) {
            animation: wave 16s linear infinite;
            opacity: 0.5;
            background-position-y: 10px;
        }
        
        .wave:nth-child(3) {
            animation: wave 20s linear infinite;
            opacity: 0.3;
            background-position-y: 15px;
        }
        
        @keyframes wave {
            0% { transform: translateX(0); }
            50% { transform: translateX(-25%); }
            100% { transform: translateX(-50%); }
        }
        
        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .container { padding: 30px; }
            button { width: 50px; height: 50px; }
            .nfc-icon { font-size: 4rem; }
        }
    </style>
</head>
<body>
    <div class="waves">
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
    </div>
    
    <div class="container">
        <div class="nfc-icon">
            <i class="fas fa-compact-disc"></i>
        </div>
        <h1>欢迎使用NFC播放音乐</h1>
        
        <div class="music-player">
            <div class="song-info">正在播放：空城计</div>
            
            <div class="controls">
                <button id="playBtn">
                    <i class="fas fa-play"></i>
                </button>
                <button id="pauseBtn">
                    <i class="fas fa-pause"></i>
                </button>
                <button id="stopBtn">
                    <i class="fas fa-stop"></i>
                </button>
            </div>
            
            <div class="volume-control">
                <i class="fas fa-volume-down"></i>
                <input type="range" id="volume" min="0" max="1" step="0.1" value="0.7">
                <i class="fas fa-volume-up"></i>
            </div>
            
            <div class="status" id="status">音乐播放中...</div>
        </div>
    </div>

    <audio id="bgMusic" loop>
        <source src="kongchengji.mp3" type="audio/mp3">
        您的浏览器不支持音频元素。
    </audio>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const audio = document.getElementById('bgMusic');
            const playBtn = document.getElementById('playBtn');
            const pauseBtn = document.getElementById('pauseBtn');
            const stopBtn = document.getElementById('stopBtn');
            const volumeControl = document.getElementById('volume');
            const status = document.getElementById('status');
            
            // 尝试自动播放
            window.addEventListener('load', function() {
                audio.volume = 0.7;
                const playPromise = audio.play();
                
                if (playPromise !== undefined) {
                    playPromise.catch(error => {
                        // 自动播放失败，显示提示
                        status.textContent = "点击播放按钮开始播放音乐";
                        status.style.color = "#ff7e5f";
                    });
                }
            });
            
            // 播放按钮

            playBtn.addEventListener('click', function() {
                audio.play();
                status.textContent = "音乐播放中...";
                status.style.color = "#feb47b";
            });
            
            // 暂停按钮
            pauseBtn.addEventListener('click', function() {
                audio.pause();
                status.textContent = "音乐已暂停";
                status.style.color = "#ff7e5f";
            });
            
            // 停止按钮
            stopBtn.addEventListener('click', function() {
                audio.pause();
                audio.currentTime = 0;
                status.textContent = "音乐已停止";
                status.style.color = "#ff7e5f";
            });
            
            // 音量控制
            volumeControl.addEventListener('input', function() {
                audio.volume = this.value;
            });
        });
    </script>
</body>
</html>
